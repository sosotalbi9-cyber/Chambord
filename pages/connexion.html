<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion – Hôtel Chambord</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <header class="hero" style="background-image: url('../img/chateau.jpg')" role="img" aria-label="Hôtel Chambord"></header>
  <div id="nav"></div>

  <main class="container">
    <div class="card carte-offre mx-auto col-md-8 col-lg-5"><div class="card-body p-4">
      <h1 class="h3 text-center mb-4">Connexion</h1>
      <form class="demo" action="#" method="post" novalidate>
        <div class="mb-3"><label class="form-label" for="c-email">Adresse e-mail</label><input type="email" class="form-control" id="c-email" name="email" autocomplete="username" required></div>
        <div class="mb-3"><label class="form-label" for="c-mdp">Mot de passe</label><input type="password" class="form-control" id="c-mdp" name="mot_de_passe" autocomplete="current-password" required></div>
        <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="c-souvenir" name="souvenir"><label class="form-check-label" for="c-souvenir">Se souvenir de moi</label></div>
        <button type="submit" class="btn btn-dark w-100">Se connecter</button>
        <p class="text-center small mt-3 mb-0"><a class="link-dark" href="#">Mot de passe oublié ?</a></p>
      </form>
    </div></div>
  </main>

  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
</body>
</html>

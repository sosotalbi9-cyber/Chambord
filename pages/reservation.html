<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réservation – Hôtel Chambord</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <header class="hero" style="background-image: url('../img/reservation.jpg')" role="img" aria-label="Hôtel Chambord"></header>
  <div id="nav"></div>

  <main class="container">
    <h1 class="visually-hidden">Réservations</h1>
    <form class="demo mx-auto mb-5 col-md-8 col-lg-6" action="#" method="post" novalidate>
      <h2 class="text-center mt-4">Réservation des Chambres</h2>
      <p class="text-center mb-4">Réservez votre séjour à l'Hôtel Chambord en quelques clics.</p>
      <input type="hidden" name="type_reservation" value="chambre">
      <div class="mb-3"><label for="chambre-type" class="form-label">Type de chambre</label><select class="form-select" id="chambre-type" name="type" required><option value="" selected disabled>Choisissez une option</option><option>La Tour du Relais</option><option>Chambre Luxe</option><option>Suite</option><option>Chambre Cosy</option></select></div>
      <div class="mb-3"><label for="chambre-arrivee" class="form-label">Date d'arrivée</label><input type="date" class="form-control" id="chambre-arrivee" name="arrivee" required></div>
      <div class="mb-3"><label for="chambre-depart" class="form-label">Date de départ</label><input type="date" class="form-control" id="chambre-depart" name="depart" required></div>
      <button type="submit" class="btn btn-dark w-100">Réserver</button>
    </form>
    <form class="demo mx-auto mb-5 col-md-8 col-lg-6" action="#" method="post" novalidate>
      <h2 class="text-center mt-4">Réservation des Soins</h2>
      <p class="text-center mb-4">Réservez votre soin au Spa de l'Hôtel Chambord pour une expérience relaxante.</p>
      <input type="hidden" name="type_reservation" value="soin">
      <div class="mb-3"><label for="soin-type" class="form-label">Type de soin</label><select class="form-select" id="soin-type" name="type" required><option value="" selected disabled>Choisissez une option</option><option>Demi-journée au spa</option><option>Morning spa</option><option>Parenthèse déjeuner & spa</option></select></div>
      <div class="mb-3"><label for="soin-arrivee" class="form-label">Date d'arrivée</label><input type="date" class="form-control" id="soin-arrivee" name="arrivee" required></div>
      <div class="mb-3"><label for="soin-depart" class="form-label">Date de départ</label><input type="date" class="form-control" id="soin-depart" name="depart" required></div>
      <button type="submit" class="btn btn-dark w-100">Réserver</button>
    </form>
    <form class="demo mx-auto mb-5 col-md-8 col-lg-6" action="#" method="post" novalidate>
      <h2 class="text-center mt-4">Réservation d'une table</h2>
      <p class="text-center mb-4">Réservez votre table au Restaurant de l'Hôtel Chambord.</p>
      <input type="hidden" name="type_reservation" value="table">
      <div class="mb-3"><label for="table-type" class="form-label">Type de table</label><select class="form-select" id="table-type" name="type" required><option value="" selected disabled>Choisissez une option</option><option>La Table seigneuriale</option><option>Le Salon</option></select></div>
      <div class="mb-3"><label for="table-date" class="form-label">Date de réservation</label><input type="date" class="form-control" id="table-date" name="date" required></div>
      <div class="mb-3"><label for="table-heure" class="form-label">Heure</label><input type="time" class="form-control" id="table-heure" name="heure" required></div>
      <button type="submit" class="btn btn-dark w-100">Réserver</button>
    </form>
  </main>

  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
</body>
</html>

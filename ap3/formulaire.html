<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

  </head>
  <body>
    
<div class="container my-5" style="max-width: 700px;">
    <h2 class="mb-4 text-center">Réservation - Hôtel Chambord</h2>
    <form action="booking_backend.php" method="POST">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="firstname" class="form-label">Prénom</label>
                <input type="text" class="form-control" id="firstname" name="firstname" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="lastname" class="form-label">Nom</label>
                <input type="text" class="form-control" id="lastname" name="lastname" required>
            </div>
        </div>
        <div class="mb-3">
            <label for="room_type" class="form-label">Type de chambre</label>
            <select class="form-select" id="room_type" name="room_type">
                <option selected>Choisissez...</option>
                <option value="standard">Chambre Standard</option>
                <option value="deluxe">Chambre Deluxe</option>
                <option value="suite">Suite Royale</option>
            </select>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="checkin" class="form-label">Date d'arrivée</label>
                <input type="date" class="form-control" id="checkin" name="checkin" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="checkout" class="form-label">Date de départ</label>
                <input type="date" class="form-control" id="checkout" name="checkout" required>
            </div>
        </div>
        <button type="submit" class="btn btn-success w-100">Réserver maintenant</button>
    </form>
</div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

  </body>
